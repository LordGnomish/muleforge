# Routing mappings: Mule choice/scatter-gather -> Camel EIP
component: routing
version: "1.0"

mappings:
  - id: choice-router
    mule_ns: ""
    mule_name: choice
    camel_component: choice
    notes: "Mule choice maps directly to Camel choice EIP"

  - id: scatter-gather
    mule_ns: ""
    mule_name: scatter-gather
    camel_component: multicast
    notes: "Not migrated: emitted as a step that throws and flagged MANUAL_REVIEW. The usual Camel form is a multicast with an aggregation strategy"

  - id: first-successful
    mule_ns: ""
    mule_name: first-successful
    camel_component: failover
    notes: "Not migrated: flagged MANUAL_REVIEW, nothing is emitted. The usual Camel form is a failover load balancer"

  - id: round-robin
    mule_ns: ""
    mule_name: round-robin
    camel_component: loadBalance
    notes: "Not migrated: flagged MANUAL_REVIEW, nothing is emitted. The usual Camel form is a round-robin load balancer"
