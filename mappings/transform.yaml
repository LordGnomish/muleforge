# Transformation mappings: Mule transform/DataWeave -> Camel processors
component: transformation
version: "1.0"

mappings:
  - id: set-payload
    mule_ns: ""
    mule_name: set-payload
    camel_component: setBody
    notes: "Mule set-payload maps to Camel setBody"

  - id: set-variable
    mule_ns: ""
    mule_name: set-variable
    camel_component: setProperty
    notes: "Mule set-variable maps to Camel exchange property"

  - id: remove-variable
    mule_ns: ""
    mule_name: remove-variable
    camel_component: removeProperty
    notes: "Not migrated: flagged MANUAL_REVIEW, nothing is emitted (the exchange property keeps its value). The Camel step is removeProperty"

  - id: transform-message
    mule_ns: ee
    mule_name: transform
    camel_component: bean
    notes: "Mule DataWeave transform requires LLM or manual conversion to Java bean"

  - id: foreach
    mule_ns: ""
    mule_name: foreach
    camel_component: split
    notes: "Mule foreach becomes a Camel split on a stated assumption, or a step that throws; always MANUAL_REVIEW (docs/mapping/MATRIX.md, Collections)"

  - id: parse-template
    mule_ns: ""
    mule_name: parse-template
    camel_component: freemarker
    maven_deps:
      - group_id: org.apache.camel.quarkus
        artifact_id: camel-quarkus-freemarker
    notes: "Not migrated: flagged MANUAL_REVIEW, nothing is emitted; this rule only adds the Freemarker dependency. The usual Camel form is the Freemarker component"
